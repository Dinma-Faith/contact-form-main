<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Frontend Mentor | Contact form</title>
  </head>
  <body>
    <!-- Contact Us First Name This field is required Last Name This field is
    required Email Address Please enter a valid email address This field is
    required Query Type General Enquiry Support Request Please select a query
    type Message This field is required I consent to being contacted by the team
    To submit this form, please consent to being contacted Submit Message Sent!
    Thanks for completing the form. We'll be in touch soon! -->

    <div class="container">
      <form id="contactForm" novalidate>
        <!-- <div id="success" class="success-message" role="alert">Message Sent! Thanks for completing the form. We'll be in touch soon!</div> -->
        <h1 class="h1">Contact Us</h1>
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            class="input"
            required
            aria-required="true" />
          <div class="error-message" id="firstNameError"></div>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            class="input"
            required
            aria-required="true" />
          <div class="error-message" id="lastNameError"></div>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input
            type="email"
            id="email"
            name="email"
            class="input"
            required
            aria-required="true" />
          <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
          <label>Query Type *</label>
          <div class="radio-group">
            <label class="radio-input"
              ><input
                type="radio"
                name="queryType"
                value="General Enquiry"
                required />
              General Enquiry</label
            >

            <label class="radio-input"
              ><input
                type="radio"
                name="queryType"
                value="Support Request"
                required />
              Support Request</label
            >
          </div>
          <div class="error-message" id="queryTypeError"></div>
        </div>

        <div class="form-group">
          <label for="message">Message *</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            required
            aria-required="true"></textarea>
          <div class="error-message" id="messageError"></div>
        </div>
      </form>
      <div class="checkbox-group">
        <input
          type="checkbox"
          id="consent"
          name="consent"
          required
          aria-required="true" />
        <label for="consent">I consent to being contacted by the team *</label>
      </div>
      <div class="error-message" id="consentError"></div>
      <button type="submit">Submit</button>
    </div>
  </body>
</html>
