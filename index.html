<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Frontend Mentor | Contact form</title>
  </head>
  <body>
    <div id="success" class="success-message" role="alert" aria-live="polite">
      <img src="/assets/images/icon-success-check.svg" /> Message Sent! <br />
      <span class="success-message-thankyou-span"
        >Thanks for completing the form. We'll be in touch soon!</span
      >
    </div>
    <div class="container">
      <h1 class="h1">Contact Us</h1>
      <form id="contactForm" novalidate>
        <div class="flex-container">
          <div class="form-group form-group-desk">
            <label for="firstName">First Name *</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              class="input"
              required
              aria-required="true"
              aria-describedby="firstNameError" />
            <div class="error-message" id="firstNameError"></div>
          </div>

          <div class="form-group form-group-desk">
            <label for="lastName">Last Name *</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              class="input"
              required
              aria-required="true"
              aria-describedby="lastNameError" />
            <div class="error-message" id="lastNameError"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input
            type="email"
            id="email"
            name="email"
            class="input"
            required
            aria-required="true"
            aria-describedby="emailError" />
          <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
          <label>Query Type *</label>
          <div
            class="radio-group"
            role="radiogroup"
            aria-describedby="queryTypeError">
            <label class="radio-input">
              <input
                type="radio"
                name="queryType"
                value="General Enquiry"
                required />
              <img
                src="assets/images/icon-radio-selected.svg"
                alt="Option Icon"
                class="radio-icon" />
              <span>General Enquiry</span>
            </label>
            <label class="radio-input">
              <input
                type="radio"
                name="queryType"
                value="Support Request"
                required />
              <img
                src="assets/images/icon-radio-selected.svg"
                alt="Option Icon"
                class="radio-icon" />
              <span>Support Request</span>
            </label>
          </div>
          <div class="error-message" id="queryTypeError"></div>
        </div>

        <div class="form-group">
          <label for="message">Message *</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            required
            aria-required="true"
            aria-describedby="messageError"></textarea>
          <div class="error-message" id="messageError"></div>
        </div>

        <div class="checkbox-group">
          <label for="consent" class="checkbox-input">
            <input type="checkbox" id="consent" name="consent" required />
            <img src="assets/images/icon-checkbox-check.svg" alt="Consent Checkbox" class="checkbox-icon" />
            <span class="checkbox-text">I consent to being contacted by the team *</span>
          </label>
          <div class="error-message" id="consentError"></div>
          
        <button type="submit">Submit</button>
      </form>
    </div>

    <script src="/form.js"></script>
  </body>
</html>
